name: Hugo Blog

on:
  push:
    branches: [main]
    paths:
      - 'posts/**/*.md'
      - 'assets/figures/**'
      - 'hugo.toml'
      - 'layouts/**'
  workflow_dispatch:

concurrency:
  group: hugo-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Setup content
        run: |
          mkdir -p content
          cp -r posts content/posts
          cp -r assets content/assets

      - name: Download PaperMod theme
        run: |
          mkdir -p themes
          git clone --depth 1 https://github.com/adityatelange/hugo-PaperMod.git themes/PaperMod

      - name: Build with Hugo
        run: hugo --minify --gc

      - name: Install Pagefind
        run: |
          mkdir -p .pagefind-bin
          curl -sL https://github.com/CloudCannon/pagefind/releases/download/v1.3.0/pagefind-v1.3.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C .pagefind-bin
          chmod +x .pagefind-bin/pagefind

      - name: Run Pagefind
        run: .pagefind-bin/pagefind --site public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
